# ─────────────────────────────────────────────────────────────────────────────
# release.yml — Build + publish on version tags
#
# Triggered by: push of a tag matching v* (e.g. v0.1.0)
#
# Calls the reusable build.yml workflow, then creates a GitHub Release
# with all binary artifacts attached.
# ─────────────────────────────────────────────────────────────────────────────

name: Release

on:
  push:
    tags:
      - "v*"
      - "[0-9]*.[0-9]*.[0-9]*"
      - "[0-9]*.[0-9]*.[0-9]*-*"

permissions:
  contents: write
  packages: write

jobs:
  verify-ci:
    name: Verify CI passed on tagged commit
    runs-on: ubuntu-22.04
    permissions:
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check CI conclusion for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHA="${{ github.sha }}"
          echo "Release tag: ${{ github.ref_name }}"
          echo "Commit:      $SHA"

          # CI runs only when the sources, the manifests or the toolchain
          # change, so a tag on a docs-only follow-up commit has no run of its
          # own: take the nearest ancestor CI ran on, provided nothing CI
          # watches changed since.
          WATCHED='^(src/|Cargo\.toml$|Cargo\.lock$|rust-toolchain\.toml$|install\.sh$|\.github/workflows/ci\.yml$)'
          RUN_SHA=""
          for CANDIDATE in $(git rev-list --max-count=50 "$SHA"); do
            COUNT=$(gh run list \
              --repo "${{ github.repository }}" \
              --commit "$CANDIDATE" \
              --workflow ci.yml \
              --limit 1 \
              --json status --jq 'length' 2>/dev/null || echo 0)
            if [ "$COUNT" != "0" ]; then
              RUN_SHA="$CANDIDATE"
              break
            fi
          done
          if [ -z "$RUN_SHA" ]; then
            echo "::error::No CI run on $SHA or its last 50 ancestors. Push the commit to main first."
            exit 1
          fi
          if [ "$RUN_SHA" != "$SHA" ]; then
            CHANGED=$(git diff --name-only "$RUN_SHA" "$SHA" | grep -E "$WATCHED" || true)
            if [ -n "$CHANGED" ]; then
              echo "::error::CI never ran on $SHA, and it changes what CI watches since $RUN_SHA:"
              echo "$CHANGED"
              exit 1
            fi
            echo "CI ran on ancestor $RUN_SHA; only files CI does not watch changed since."
          fi

          # Poll for up to 20 minutes in case CI has not yet completed for that
          # SHA (e.g. tag pushed immediately after merge).
          for i in $(seq 1 20); do
            PAYLOAD=$(gh run list \
              --repo "${{ github.repository }}" \
              --commit "$RUN_SHA" \
              --workflow ci.yml \
              --limit 1 \
              --json status,conclusion,url 2>/dev/null || echo "[]")

            STATUS=$(echo "$PAYLOAD" | jq -r '.[0].status // empty')
            CONCLUSION=$(echo "$PAYLOAD" | jq -r '.[0].conclusion // empty')
            RUN_URL=$(echo "$PAYLOAD" | jq -r '.[0].url // empty')

            echo "[attempt $i/20] status=${STATUS:-<none>} conclusion=${CONCLUSION:-<none>}"

            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI passed for $RUN_SHA ✓ ($RUN_URL)"
                exit 0
              fi
              echo "::error::CI conclusion is '$CONCLUSION' for $RUN_SHA. Release aborted."
              echo "::error::See: $RUN_URL"
              exit 1
            fi

            sleep 30
          done

          echo "::error::CI did not complete within 20 minutes for $RUN_SHA."
          echo "::error::Either CI was never triggered (push the commit to main first) or it is stuck."
          exit 1

  build:
    name: Build all targets
    needs: verify-ci
    uses: ./.github/workflows/build.yml
    with:
      channel: release
      version_tag: ${{ github.ref_name }}
      push_docker: true
    permissions:
      contents: read
      packages: write

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download all binary artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: oxydllm-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist/

      - name: Extract changelog section for this tag
        id: changelog
        run: |
          VERSION="${{ github.ref_name }}"

          if [ ! -f CHANGELOG.md ]; then
            echo "::warning::CHANGELOG.md not found; release body will omit the changelog section."
            BODY="_No CHANGELOG.md found in repository._"
          else
            # Extract the block from "## <VERSION>" up to (but not including)
            # the next "## " heading. Drop the trailing "**Full Changelog**"
            # link and inter-section "---" separators so they don't duplicate
            # the auto-generated notes appended by softprops/action-gh-release.
            # The heading is matched as a literal prefix (via index()) so any
            # regex meta-characters in the version — `.`, `+` (semver build
            # metadata), `-` — are treated as plain text. Falls back to a
            # placeholder if the tag has no entry yet — release proceeds,
            # but we surface a warning.
            HEADING="## ${VERSION}"
            BODY=$(awk -v h="$HEADING" '
              # Match "## <version>" exactly, or "## <version>" followed by
              # whitespace (so trailing spaces in a heading do not break the
              # match while still rejecting longer-prefix collisions, e.g.
              # tag "1.2" must not match heading "## 1.2.3").
              !in_section && index($0, h) == 1 && \
                (length($0) == length(h) || \
                 substr($0, length(h) + 1, 1) ~ /[[:space:]]/) {
                in_section = 1
                next
              }
              in_section && /^## / { exit }
              in_section && /^\*\*Full Changelog\*\*:/ { next }
              in_section && /^---[[:space:]]*$/ { next }
              in_section { print }
            ' CHANGELOG.md)

            if [ -z "$(echo "$BODY" | tr -d '[:space:]')" ]; then
              echo "::warning::No changelog entry found for ${VERSION} in CHANGELOG.md."
              BODY="_No changelog entry for \`${VERSION}\` in CHANGELOG.md._"
            fi
          fi

          # Hand the multi-line body to subsequent steps via $GITHUB_OUTPUT
          # using the random-delimiter form recommended by GitHub.
          DELIM="EOF_$(openssl rand -hex 8)"
          {
            echo "body<<${DELIM}"
            echo "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ${{ steps.changelog.outputs.body }}

            ## Installation

            **macOS (Apple Silicon)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Linux x86_64 (CUDA — Ada / Hopper / Blackwell / Blackwell Ultra / Blackwell Desktop)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            **Linux arm64 (CUDA — GH200 / GB300 / Jetson Thor / DGX Spark)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | sh
            ```

            Installer auto-selects the right binary from detected GPU compute capability.
            Override with `OXYDLLM_CUDA_TARGET=<ada|hopper|blackwell|blackwell-ultra|blackwell-desktop>` (x86_64)
            or `OXYDLLM_CUDA_TARGET=<hopper|blackwell|blackwell-ultra|thor|blackwell-desktop>` (arm64).

            **Linux (CPU only)**
            ```bash
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/install.sh | OXYDLLM_NO_GPU=1 sh
            ```

            **Docker (CUDA)**
            ```bash
            docker run --gpus all -p 11313:11313 \
              -v ~/.oxydllm/models:/root/.oxydllm/models \
              ghcr.io/${{ github.repository }}:latest start
            ```

            x86_64 explicit CUDA tags: `:cuda-ada`, `:cuda-hopper`, `:cuda-blackwell`, `:cuda-blackwell-ultra`, `:cuda-blackwell-desktop`.
            ARM64 explicit CUDA tags: `:cuda-hopper-arm64`, `:cuda-blackwell-arm64`, `:cuda-blackwell-ultra-arm64`, `:cuda-thor-arm64`, `:cuda-blackwell-desktop-arm64`.

            **Docker (CPU)**
            ```bash
            docker run -p 11313:11313 \
              -v ~/.oxydllm/models:/root/.oxydllm/models \
              ghcr.io/${{ github.repository }}:cpu start
            ```

            ## SHA-256 checksums
            See the `.sha256` files attached to this release.
